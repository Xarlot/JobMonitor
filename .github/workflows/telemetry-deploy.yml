# Telemetry server + dashboard → Azure App Service.
#

name: Deploy telemetry server

on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - 'packages/telemetry-schema/**'
      - '.github/workflows/telemetry-deploy.yml'
  workflow_dispatch:

concurrency:
  group: telemetry-deploy
  cancel-in-progress: false

env:
  # Lowercase and spelled out rather than built from `github.repository_owner`, which is `DevExpress`:
  # ghcr rejects any uppercase letter in an image path, and the expression language has no `lower()`.
  IMAGE: ghcr.io/devexpress/javajobmonitor/telemetry-receiver

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Electron belongs to the desktop client and is ~100 MB we have no use for here.
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # The generated protobuf is committed, so it can drift from the .proto. Drift is the bad kind
      # of bug here: the client would encode one shape while the receiver validates another, and
      # the symptom is batches quietly failing to parse.
      - run: npm run proto:check

      # The shared contract, in both node and jsdom — the client encrypts in Electron's main
      # process and the receiver decrypts in Node, and a divergence between them would look exactly
      # like intermittent data loss.
      - run: npm run test:schema

      - run: npm test --workspace @jobmonitor/telemetry-receiver
      - run: npx tsc --noEmit -p server/telemetry-receiver

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # The default builder uses the `docker` driver, which cannot export a cache — `cache-to` then
      # fails the build outright rather than degrading to no caching. This switches to
      # `docker-container`, which can.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          # Workspace root, because the image needs the shared schema package alongside the server.
          context: .
          file: server/telemetry-receiver/Dockerfile
          push: true
          # Deployed by digest below, never by a floating tag — `:latest` makes "what is running"
          # unanswerable after the fact.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: telemetry
    permissions:
      id-token: write
      contents: read
    steps:
      # Federated credentials — no stored client secret to rotate or leak.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The registry credential is stored by App Service and reused on **every** container start —
      # platform maintenance, a settings change, a manual restart — not only during this deploy. So
      # it cannot be `GITHUB_TOKEN`, which is revoked the moment this job ends: the first pull would
      # succeed here and the app would then fail to start days later, for no visible reason.
      #
      # A dedicated read-only token instead. The image stays internal, which rules out the other way
      # to solve this — a public package needs no credential at all.
      - name: Point the app at this exact image
        env:
          # Through the environment rather than interpolated into the script: the expansion happens
          # before the shell sees the line, so a token containing a shell metacharacter would
          # otherwise be parsed as one.
          PULL_USER: ${{ vars.GHCR_PULL_USER }}
          PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          # Checked rather than assumed. An empty password is accepted by `az` without complaint and
          # the deploy reports success; the app then cannot pull, which surfaces as a container that
          # will not start and says nothing about why.
          if [ -z "$PULL_USER" ] || [ -z "$PULL_TOKEN" ]; then
            echo "::error::GHCR_PULL_USER / GHCR_PULL_TOKEN are not both set. App Service needs a" \
                 "durable read-only registry credential — see the comment above this step."
            exit 1
          fi
          az webapp config container set \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --container-image-name "${{ env.IMAGE }}@${{ needs.build.outputs.digest }}" \
            --container-registry-url https://ghcr.io \
            --container-registry-user "$PULL_USER" \
            --container-registry-password "$PULL_TOKEN"

      - name: Restart
        run: |
          az webapp restart \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"

      # A deploy that "succeeded" while the app fails to boot is the failure mode worth catching:
      # App Service reports the container as set regardless of whether it starts.
      #
      # Probed at `/api/ingest`, not at a page, and with POST. Every page is behind Entra ID, and
      # Easy Auth sits in *front* of the container — it answers 401 whether or not anything is
      # running, so treating that as success would make this step assert nothing. (It returns 401
      # rather than the 302 the configuration asks for, because it only redirects requests that look
      # like a browser's.) `/api/ingest` is the one excluded path, so a reply to it comes from the
      # application itself.
      #
      # POST without a token, because of the order inside that handler: it loads the configuration
      # first and checks the token second. So 401 means more than "the container serves" — it means
      # the app settings parsed, the Ably key and receiver keys are present and the right shape. A
      # container that starts and is misconfigured answers 503 with `not configured` instead, which
      # is a different failure and reported as one.
      #
      # Nothing happens as a result of the request: it is refused before any work is done.
      - name: Wait for the app to answer
        run: |
          url="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/ingest"
          for attempt in $(seq 1 30); do
            reply=$(curl -s --max-time 10 -w '\n%{http_code}' -X POST "$url" || true)
            code=${reply##*$'\n'}
            body=${reply%$'\n'*}

            if [ "$code" = "401" ]; then
              echo "up after ${attempt} attempt(s): the app answered, and its configuration loaded"
              exit 0
            fi

            # App Service also answers 503 while a container is still starting, so the two are told
            # apart by the body — ours is JSON from the route, the platform's is an HTML page.
            case "$body" in
              *'not configured'*)
                echo "::error::The container is running but its configuration is invalid. One of the" \
                     "app settings is missing or malformed — compare against server/azure/.env.receiver."
                exit 1 ;;
            esac

            echo "attempt ${attempt}: HTTP ${code:-none}"
            sleep 10
          done
          echo "::error::app did not answer within 5 minutes"
          exit 1
