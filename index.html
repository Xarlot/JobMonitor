<!doctype html>
<!-- `data-dark-theme` must name the theme whose CSS is actually imported: this app loads
     dark-dimmed.css, which is scoped to `[data-dark-theme="dark_dimmed"]`, so "dark" matches nothing
     and every token is undefined until ThemeContext rewrites the attribute after mount. -->
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark_dimmed">
  <head>
    <meta charset="UTF-8" />
    <!-- %CSP% -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <!--
      Always reserve the vertical scrollbar gutter so centered content doesn't shift horizontally
      when switching between short and tall tabs.

      That gutter is why the document itself has to be painted. The app's background sits on a div
      (`min-height: 100vh`), which does not extend into the reserved gutter or the overscroll area —
      Primer 36's styled-components BaseStyles painted the document and 38 does not, so those strips
      fell through to whatever is behind the page. In a browser that is white and invisible; in the
      desktop app it is the window's own `backgroundColor` (#0d1117), which showed up as a black band
      down the side of a light UI.

      `color-scheme` is set here too, and it has to be. It is what tells the browser how to paint the
      viewport scrollbar, and the browser reads it from the **root element**.

      Primer looks like it covers this and does not. `BaseStyles` ships:

        [data-color-mode=light] input                    { color-scheme: light }
        [data-color-mode=dark]  input                    { color-scheme: dark  }
        [data-color-mode=auto][data-light-theme*=light]  { color-scheme: light }   (inside @media)
        [data-color-mode=auto][data-dark-theme*=dark]    { color-scheme: dark  }   (inside @media)

      In `auto` the last two match `html` and it works. With a theme chosen explicitly the selector
      ends in `input`, so the declaration reaches text fields and nothing else, and the root is left
      with no scheme at all — a light scrollbar down the side of a dark app.

      An earlier version of this file dropped these rules on the grounds that Primer already declared
      them. That was wrong twice: the grep behind it matched `prefers-color-scheme` as though it were a
      declaration, and the measurement behind it read `getComputedStyle`, which reports the *used*
      value and so says `dark` whether or not anything declared it.

      Inline rather than in a stylesheet so it applies before the bundle parses. The literal fallbacks
      cover only that instant; once the theme CSS is in, the tokens win — #ffffff and #212830 are the
      values of `--bgColor-default` in the two themes this app loads.
    -->
    <style>
      html {
        scrollbar-gutter: stable;
        color-scheme: light;
        background-color: var(--bgColor-default, #ffffff);
      }
      @media (prefers-color-scheme: dark) {
        html {
          color-scheme: dark;
          background-color: var(--bgColor-default, #212830);
        }
      }
      /* A theme chosen explicitly outranks the media query in both directions, by specificity rather
         than by order — so this holds however the rules end up sorted. */
      html[data-color-mode='light'] {
        color-scheme: light;
      }
      html[data-color-mode='dark'] {
        color-scheme: dark;
      }
    </style>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231f2328'/%3E%3Cpath fill='%232da44e' d='M3 8h2l1.5-3 2 6L11 8h2' stroke='%232da44e' stroke-width='1.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>Job Monitor — GitHub Actions Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
